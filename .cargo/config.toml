# GalaxDB build configuration
# Enables AES-NI, AVX2, and other SIMD instructions for maximum performance

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "target-feature=+aes,+avx2,+sse2,+sse4.1,+ssse3,+pclmulqdq",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "target-feature=+aes,+avx2,+sse2,+sse4.1,+ssse3,+pclmulqdq",
]
