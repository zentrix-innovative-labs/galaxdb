name: Publish to PyPI

# Triggered automatically when a GitHub Release is published (which the
# release.yml workflow creates on every v* tag), or manually via
# workflow_dispatch.
#
# Builds Python wheels for 5 targets + a source distribution, then
# publishes everything to PyPI using trusted publishing (no token needed).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Linux wheels — native runners to avoid cross-compilation Docker issues
  # -----------------------------------------------------------------------
  build-linux:
    name: "Wheel · Linux ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm   # GitHub-hosted native arm64 runner

    steps:
      - uses: actions/checkout@v4

      # Build inside the official manylinux_2_28 container via maturin-action.
      # Building natively on ubuntu-latest and passing `--manylinux 2_28` fails
      # the auditwheel policy check (the runner's glibc is newer than the 2_28
      # baseline), which is why the previous native build broke. The container
      # also isolates the heavy DataFusion/Lance/pyo3 release compile. protoc +
      # cmake are installed inside the container via before-script-linux.
      - name: Build wheel (${{ matrix.target }})
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}-unknown-linux-gnu
          manylinux: "2_28"
          args: --release -m galaxdb-python/Cargo.toml
          before-script-linux: |
            # manylinux_2_28 is AlmaLinux 8 (dnf). Its dnf-packaged protoc
            # predates proto3-optional support (protoc >= 3.12), so
            # lance-encoding's build script (which always passes
            # --experimental_allow_proto3_optional) fails with
            # "Unknown flag: --experimental_allow_proto3_optional". Download a
            # modern protoc release directly instead of the distro package.
            # cmake is for other transitive build scripts; openssl-devel +
            # pkgconfig + perl-core because hf-hub and lance's reqwest client
            # use native-tls, which links system OpenSSL on Linux
            # (macOS/Windows use SecureTransport/SChannel, no OpenSSL needed).
            PROTOC_VERSION=25.3
            case "$(uname -m)" in
              x86_64)  PROTOC_ARCH=x86_64 ;;
              aarch64) PROTOC_ARCH=aarch_64 ;;
              *) echo "unsupported arch $(uname -m)"; exit 1 ;;
            esac
            curl -fsSLo /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${PROTOC_ARCH}.zip"
            if command -v unzip >/dev/null 2>&1; then
              unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            else
              python3 -c "import zipfile; zipfile.ZipFile('/tmp/protoc.zip').extractall('/usr/local')"
            fi
            chmod +x /usr/local/bin/protoc
            rm -f /tmp/protoc.zip
            protoc --version

            if command -v dnf >/dev/null 2>&1; then
              dnf install -y cmake openssl-devel pkgconfig perl-core || \
              dnf install -y cmake openssl-devel pkgconfig
            elif command -v yum >/dev/null 2>&1; then
              yum install -y cmake openssl-devel pkgconfig perl-core || \
              yum install -y cmake openssl-devel pkgconfig
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y cmake libssl-dev pkg-config unzip
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: target/wheels/*.whl

  # -----------------------------------------------------------------------
  # macOS wheels
  # -----------------------------------------------------------------------
  build-macos:
    name: "Wheel · macOS ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64
            runner: macos-14        # Apple Silicon — builds arm64 natively
          - target: x86_64
            runner: macos-14        # cross-compile for Intel on the same runner

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin + protoc
        run: |
          pip install maturin
          brew install protobuf cmake

      - name: Build wheel (${{ matrix.target }})
        run: |
          maturin build --release \
            --target ${{ matrix.target }}-apple-darwin \
            -m galaxdb-python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: target/wheels/*.whl

  # -----------------------------------------------------------------------
  # Windows wheel
  # -----------------------------------------------------------------------
  build-windows:
    name: "Wheel · Windows x86_64"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin + protoc
        run: |
          pip install maturin
          choco install protoc cmake --yes

      - name: Build wheel
        run: maturin build --release -m galaxdb-python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: target/wheels/*.whl

  # -----------------------------------------------------------------------
  # Source distribution — fallback for platforms without a pre-built wheel.
  # pip will compile from source (requires Rust on the user's machine).
  # -----------------------------------------------------------------------
  build-sdist:
    name: "Source distribution"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python + maturin + protoc
        run: |
          pip install maturin
          sudo apt-get update -y && sudo apt-get install -y protobuf-compiler cmake

      - name: Build sdist
        run: maturin sdist -m galaxdb-python/Cargo.toml
        env:
          PROTOC: /usr/bin/protoc

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  # -----------------------------------------------------------------------
  # Publish all wheels + sdist to PyPI via trusted publishing.
  # No PYPI_TOKEN needed — set up the "pypi" environment in repo settings
  # and add the trusted publisher on pypi.org (owner: zentrix-innovative-labs,
  # repo: galaxdb, workflow: publish-pypi.yml).
  # -----------------------------------------------------------------------
  publish:
    name: "Publish to PyPI"
    needs: [build-linux, build-macos, build-windows, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/galaxdb-client/
    permissions:
      id-token: write   # required for trusted publishing

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
