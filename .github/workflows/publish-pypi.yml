name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual trigger

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-14        # Apple Silicon arm64 (M1/M2/M3)
            target: aarch64
          - os: windows-latest  # Windows x86_64
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --yes

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: maturin build --release --manylinux off -m galaxdb-python/Cargo.toml
        env:
          PROTOC: /usr/bin/protoc

      - name: Build wheel (macOS / Windows)
        if: runner.os != 'Linux'
        run: maturin build --release -m galaxdb-python/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/*.whl

  build-sdist:
    # Source distribution — fallback for Linux aarch64, FreeBSD, or any
    # platform without a pre-built wheel. pip will compile from source
    # (requires Rust on the user's machine).
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Build sdist
        run: maturin sdist -m galaxdb-python/Cargo.toml
        env:
          PROTOC: /usr/bin/protoc

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/galaxdb-client/
    permissions:
      id-token: write  # required for trusted publishing (no token needed)

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: List distributions
        run: ls -lh dist/

      - name: Publish to PyPI (Trusted Publisher — no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
