name: Release

# Triggered by a version tag (e.g. v0.2.0).
# Builds the server binary for all four platforms in parallel, then creates
# a GitHub Release and attaches the binaries.  The "published" release event
# then automatically triggers publish-pypi.yml.
#
# To cut a release:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # -----------------------------------------------------------------------
  # Linux x86_64 — runs natively on ubuntu-latest
  # -----------------------------------------------------------------------
  build-linux-x86_64:
    name: "Build · Linux x86_64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build deps
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler cmake

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build server (release)
        run: cargo build --release -p galaxdb-server

      - name: Strip binary
        run: strip target/release/galaxdb-server

      - name: Rename artifact
        run: cp target/release/galaxdb-server galaxdb-server-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: galaxdb-server-linux-x86_64
          path: galaxdb-server-linux-x86_64

  # -----------------------------------------------------------------------
  # Linux aarch64 — native arm64 runner (no cross-compilation or Docker)
  # -----------------------------------------------------------------------
  build-linux-aarch64:
    name: "Build · Linux aarch64"
    runs-on: ubuntu-24.04-arm   # GitHub-hosted native arm64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build deps
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler cmake libssl-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build server (release)
        run: cargo build --release -p galaxdb-server

      - name: Strip binary
        run: strip target/release/galaxdb-server

      - name: Rename artifact
        run: cp target/release/galaxdb-server galaxdb-server-linux-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: galaxdb-server-linux-aarch64
          path: galaxdb-server-linux-aarch64

  # -----------------------------------------------------------------------
  # macOS arm64 (Apple Silicon) — native on macos-14
  # -----------------------------------------------------------------------
  build-macos-arm64:
    name: "Build · macOS arm64"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: brew install protobuf cmake

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build server (release)
        run: cargo build --release -p galaxdb-server

      - name: Strip binary
        run: strip target/release/galaxdb-server

      - name: Rename artifact
        run: cp target/release/galaxdb-server galaxdb-server-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: galaxdb-server-macos-arm64
          path: galaxdb-server-macos-arm64

  # -----------------------------------------------------------------------
  # macOS x86_64 (Intel) — cross-compiled on macos-14
  # -----------------------------------------------------------------------
  build-macos-x86_64:
    name: "Build · macOS x86_64"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install protoc
        run: brew install protobuf cmake

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build server (release, x86_64)
        run: cargo build --release -p galaxdb-server --target x86_64-apple-darwin

      - name: Strip binary
        run: strip target/x86_64-apple-darwin/release/galaxdb-server

      - name: Rename artifact
        run: cp target/x86_64-apple-darwin/release/galaxdb-server galaxdb-server-macos-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: galaxdb-server-macos-x86_64
          path: galaxdb-server-macos-x86_64

  # -----------------------------------------------------------------------
  # Windows x86_64 — native server binary. Best-effort: `continue-on-error`
  # so a Windows-specific build hiccup never blocks the Linux/macOS release;
  # the .exe is attached only when the build succeeds (see github-release).
  # -----------------------------------------------------------------------
  build-windows-x86_64:
    name: "Build · Windows x86_64"
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build server (release)
        run: cargo build --release -p galaxdb-server

      - name: Rename artifact
        run: copy target\release\galaxdb-server.exe galaxdb-server-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: galaxdb-server-windows-x86_64
          path: galaxdb-server-windows-x86_64.exe

  # -----------------------------------------------------------------------
  # Create the GitHub Release and attach all built binaries.
  # The release event triggers publish-pypi.yml automatically.
  # -----------------------------------------------------------------------
  github-release:
    name: "GitHub Release"
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-arm64
      - build-macos-x86_64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh dist/

      - name: Compute SHA256 checksums
        run: |
          cd dist
          # Checksum every server binary that was actually built (the Windows
          # .exe is best-effort and may be absent), but not existing .sha256s.
          for f in galaxdb-server-*; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done
          ls -lh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "GalaxDB ${TAG}" \
            --notes "## GalaxDB ${TAG}

          ### What's new
          See [ROADMAP.md](https://github.com/zentrix-innovative-labs/galaxdb/blob/main/ROADMAP.md) for the full list of shipped features.

          ### Install

          **One-liner (Linux / macOS):**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/zentrix-innovative-labs/galaxdb/main/install.sh | bash
          \`\`\`

          **Homebrew (macOS / Linux):**
          \`\`\`bash
          brew tap zentrix-innovative-labs/galaxdb https://github.com/zentrix-innovative-labs/galaxdb
          brew install galaxdb
          \`\`\`

          **Python client (pip):**
          \`\`\`bash
          pip install galaxdb-client==${TAG#v}
          \`\`\`

          **Docker:**
          \`\`\`bash
          docker pull ghcr.io/zentrix-innovative-labs/galaxdb:${TAG}
          \`\`\`

          ### Direct download
          | Platform | Binary |
          |---|---|
          | Linux x86_64  | \`galaxdb-server-linux-x86_64\`       |
          | Linux aarch64 | \`galaxdb-server-linux-aarch64\`      |
          | macOS arm64   | \`galaxdb-server-macos-arm64\`        |
          | macOS x86_64  | \`galaxdb-server-macos-x86_64\`       |
          | Windows x86_64 | \`galaxdb-server-windows-x86_64.exe\` |

          Windows users can also run the server under Docker Desktop (WSL2). SHA256 checksums are attached as \`.sha256\` files.
          " \
            dist/*

  # -----------------------------------------------------------------------
  # Regenerate the Homebrew formula from the real release checksums and
  # commit it back to main. No human edits version or SHA256 by hand —
  # scripts/gen-homebrew-formula.sh derives every value from the published
  # `.sha256` assets. install.sh needs no bump: it resolves the latest
  # release at runtime via the GitHub API.
  # -----------------------------------------------------------------------
  update-homebrew-formula:
    name: "Update Homebrew formula"
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the regenerated formula to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p /tmp/rel-cksum
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" \
            -D /tmp/rel-cksum -p '*.sha256'

      - name: Regenerate Formula/galaxdb.rb
        run: |
          TAG="${GITHUB_REF_NAME}"
          chmod +x scripts/gen-homebrew-formula.sh
          ./scripts/gen-homebrew-formula.sh "${TAG#v}" /tmp/rel-cksum

      - name: Commit and push if changed
        run: |
          TAG="${GITHUB_REF_NAME}"
          if git diff --quiet -- Formula/galaxdb.rb; then
            echo "Formula already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/galaxdb.rb
          git commit -m "chore(release): regenerate Homebrew formula for ${TAG} [skip ci]"
          git push origin main
