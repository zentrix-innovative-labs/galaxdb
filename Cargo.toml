[workspace]
resolver = "2"
members = [
    "crates/galaxdb-common",
    "crates/galaxdb-storage",
    "crates/galaxdb-io",
    "crates/galaxdb-crypto",
    "crates/galaxdb-auth",
    "crates/galaxdb-vector",
    "crates/galaxdb-sql",
    "crates/galaxdb-query",
    "crates/galaxdb-wire",
    "crates/galaxdb-versioning",
    "crates/galaxdb-backup",
    "crates/galaxdb-sidecar",
    "crates/galaxdb-observe",
    "crates/galaxdb-cluster",
    "crates/galaxdb-server",
    "crates/galaxdb-embedded",
    "galaxdb-python",
    "benchmarks",
    "tests/chaos",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Shared types / common
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency & data structures
crossbeam-skiplist = "0.1"

# Hashing & checksums
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Memory-mapped files
memmap2 = "0.9"

# Encryption
aes-gcm = "0.10"
aegis = "0.9"

# SCRAM-SHA-256 authentication (RFC 5802 / 7677). Pure-Rust RustCrypto
# stack, no OpenSSL. Versions chosen to match crates already in the graph
# (hmac 0.13 / sha2 0.11) so no duplicate major versions are introduced.
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64 = "0.22"
subtle = "2.6"

# AWS KMS
aws-sdk-kms = "1"
aws-config = "1"

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Metrics & observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = "0.24"

# Half-precision floats
half = "2"

# Random number generation
rand = "0.8"

# Parallel computation
rayon = "1.10"

# Fast synchronization primitives
parking_lot = "0.12"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing utilities
tempfile = "3"

# Python FFI. Bumped from 0.22 → 0.24 to close RUSTSEC-2025-0020
# (PyString::from_object overread). Phase H advisories gate fails
# on anything < 0.24.1.
pyo3 = { version = "0.24", features = ["extension-module"] }

# SQL parsing
sqlparser = { version = "0.50", features = ["visitor"] }

# Apache Arrow — columnar interchange for the query layer (galaxdb-query).
# Pinned to the version DataFusion 52.5.0 resolves so no duplicate arrow
# major enters the graph (see galaxdb-query / HTAP spec Req 7.2).
arrow = "=57.3.1"

# HTTP server
axum = "0.7"

# Lance columnar format
# lance = "0.17"

# ONNX Runtime
# ort = "2"

# io_uring (Linux only)
io-uring = "0.7"

# Internal crates
galaxdb-common = { path = "crates/galaxdb-common" }
galaxdb-storage = { path = "crates/galaxdb-storage" }
galaxdb-io = { path = "crates/galaxdb-io" }
galaxdb-crypto = { path = "crates/galaxdb-crypto" }
galaxdb-auth = { path = "crates/galaxdb-auth" }
galaxdb-vector = { path = "crates/galaxdb-vector" }
galaxdb-sql = { path = "crates/galaxdb-sql" }
galaxdb-query = { path = "crates/galaxdb-query" }
galaxdb-wire = { path = "crates/galaxdb-wire" }
galaxdb-versioning = { path = "crates/galaxdb-versioning" }
galaxdb-sidecar = { path = "crates/galaxdb-sidecar" }
galaxdb-observe = { path = "crates/galaxdb-observe" }
galaxdb-cluster = { path = "crates/galaxdb-cluster" }
galaxdb-server = { path = "crates/galaxdb-server" }
galaxdb-embedded = { path = "crates/galaxdb-embedded" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
