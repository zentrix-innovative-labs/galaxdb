[workspace]
resolver = "2"
members = [
    "crates/galaxdb-common",
    "crates/galaxdb-storage",
    "crates/galaxdb-io",
    "crates/galaxdb-crypto",
    "crates/galaxdb-vector",
    "crates/galaxdb-sql",
    "crates/galaxdb-wire",
    "crates/galaxdb-versioning",
    "crates/galaxdb-sidecar",
    "crates/galaxdb-observe",
    "crates/galaxdb-server",
    "crates/galaxdb-embedded",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
# Shared types / common
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency & data structures
crossbeam-skiplist = "0.1"

# Hashing & checksums
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Memory-mapped files
memmap2 = "0.9"

# Encryption
aes-gcm = "0.10"

# AWS KMS
aws-sdk-kms = "1"
aws-config = "1"

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Metrics & observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = "0.24"

# Half-precision floats
half = "2"

# Random number generation
rand = "0.8"

# Testing utilities
tempfile = "3"

# Python FFI
pyo3 = { version = "0.22", features = ["extension-module"] }

# SQL parsing
sqlparser = { version = "0.50", features = ["visitor"] }

# HTTP server
axum = "0.7"

# Lance columnar format
# lance = "0.17"

# ONNX Runtime
# ort = "2"

# io_uring (Linux only)
# io-uring = "0.7"

# Internal crates
galaxdb-common = { path = "crates/galaxdb-common" }
galaxdb-storage = { path = "crates/galaxdb-storage" }
galaxdb-io = { path = "crates/galaxdb-io" }
galaxdb-crypto = { path = "crates/galaxdb-crypto" }
galaxdb-vector = { path = "crates/galaxdb-vector" }
galaxdb-sql = { path = "crates/galaxdb-sql" }
galaxdb-wire = { path = "crates/galaxdb-wire" }
galaxdb-versioning = { path = "crates/galaxdb-versioning" }
galaxdb-sidecar = { path = "crates/galaxdb-sidecar" }
galaxdb-observe = { path = "crates/galaxdb-observe" }
galaxdb-server = { path = "crates/galaxdb-server" }
galaxdb-embedded = { path = "crates/galaxdb-embedded" }
