[package]
name = "galaxdb-benchmarks"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
galaxdb-common = { path = "../crates/galaxdb-common" }
galaxdb-observe = { path = "../crates/galaxdb-observe" }
galaxdb-storage = { path = "../crates/galaxdb-storage" }
galaxdb-sql = { path = "../crates/galaxdb-sql" }
# Full SQL frontend (native + DataFusion analytical path) for the analytical
# benchmark (ClickBench-style aggregation + TPC-H-style star join).
galaxdb-embedded = { path = "../crates/galaxdb-embedded" }
galaxdb-io = { path = "../crates/galaxdb-io" }
galaxdb-vector = { path = "../crates/galaxdb-vector" }
galaxdb-sidecar = { path = "../crates/galaxdb-sidecar" }
# For the single-row wire INSERT benchmark (task 10.4): drive a real
# galaxdb-server over the PostgreSQL wire protocol with a real client.
galaxdb-server = { path = "../crates/galaxdb-server" }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["full"] }
bytes = "1"
futures-util = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
