[package]
name = "galaxdb-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Anti-corruption boundary for the relational/analytical query layer. The ONLY crate permitted to depend on Apache DataFusion (HTAP spec Req 7)."

[dependencies]
galaxdb-common.workspace = true
galaxdb-sql.workspace = true
galaxdb-storage = { path = "../galaxdb-storage" }
arrow.workspace = true
async-trait = "0.1"
tokio = { workspace = true }
tracing.workspace = true

# Apache DataFusion — the relational/analytical execution engine. This is
# the ONLY crate in the workspace permitted to depend on it (HTAP spec
# ADR-0001, Req 7.1; enforced by tests/containment.rs). The exact pin
# `=52.5.0` matches the version `lance` already resolves so no duplicate
# DataFusion/Arrow major enters the graph (Req 7.2; enforced by deny.toml).
# Upgrades are deliberate and gated by the SQL conformance corpus (Req 7.4).
datafusion = "=52.5.0"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
