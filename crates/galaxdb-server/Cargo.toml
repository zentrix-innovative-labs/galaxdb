[package]
name = "galaxdb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GalaxDB standalone server (PostgreSQL wire protocol)"

[lib]
name = "galaxdb_server"
path = "src/lib.rs"

[[bin]]
name = "galaxdb-server"
path = "src/main.rs"

[dependencies]
galaxdb-common.workspace = true
galaxdb-embedded.workspace = true
galaxdb-observe.workspace = true
galaxdb-wire.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio-postgres = "0.7"
