[package]
name = "galaxdb-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedding Sidecar binary (Candle, Unix socket, backlog)"

[features]
# Enable tests that launch the real sidecar binary and download a
# sentence-transformer model from HuggingFace Hub (~90 MB on first run).
# Off by default so `cargo test -p galaxdb-sidecar` stays hermetic.
online-tests = []

[lib]
name = "galaxdb_sidecar"
path = "src/lib.rs"

[[bin]]
name = "galaxdb-sidecar"
path = "src/main.rs"

[dependencies]
galaxdb-common.workspace = true
galaxdb-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = "0.4"
tokenizers = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
