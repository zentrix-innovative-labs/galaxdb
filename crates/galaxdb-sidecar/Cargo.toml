[package]
name = "galaxdb-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedding Sidecar binary (ort crate, Unix socket, backlog)"

[lib]
name = "galaxdb_sidecar"
path = "src/lib.rs"

[[bin]]
name = "galaxdb-sidecar"
path = "src/main.rs"

[dependencies]
galaxdb-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ONNX Runtime — commented out until model files are available.
# The sidecar binary requires ort for actual inference.
# For now, the protocol and client code work without it.
# ort = "2"

[dev-dependencies]
tempfile.workspace = true
