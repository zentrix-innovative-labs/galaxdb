[package]
name = "galaxdb-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embedding Sidecar binary (ort crate, Unix socket, backlog)"

[lib]
name = "galaxdb_sidecar"
path = "src/lib.rs"

[[bin]]
name = "galaxdb-sidecar"
path = "src/main.rs"

[dependencies]
galaxdb-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
hf-hub = "0.4"
tokenizers = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
