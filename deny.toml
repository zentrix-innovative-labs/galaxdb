# Phase H gate H2: cargo-deny configuration.
#
# Primary purpose: keep vendor SDKs out of the dependency graph. GalaxDB
# supports AWS / GCP / Azure / Vault key management exclusively through
# `ExternalCommandKeyProvider` + `HashicorpVaultKeyProvider` (pure Rust,
# HTTP). No cloud-provider SDK is ever permitted — that preserves the
# no-vendor-lock-in rule from .kiro/steering/engineering-principles.md §5.
#
# Run locally with:
#   cargo install cargo-deny  # once
#   cargo deny check bans
#   cargo deny check licenses
#   cargo deny check advisories
#
# CI runs all three under the same name via .github/workflows/ci.yml.

[graph]
all-features = false
no-default-features = false

[bans]
multiple-versions = "allow"
wildcards = "warn"
highlight = "all"

# The core rule: no cloud-vendor SDK in any build profile, any feature,
# any target.
deny = [
    # AWS SDK family
    { name = "aws-sdk-kms" },
    { name = "aws-sdk-s3" },
    { name = "aws-sdk-dynamodb" },
    { name = "aws-sdk-secretsmanager" },
    { name = "aws-sdk-sts" },
    { name = "aws-config" },
    # Google Cloud SDK family
    { name = "google-cloud-kms" },
    { name = "google-cloud-storage" },
    { name = "google-cloud-auth" },
    { name = "gcloud-sdk" },
    # Azure SDK family
    { name = "azure_core" },
    { name = "azure_identity" },
    { name = "azure_storage" },
    { name = "azure_security_keyvault" },
]

# Never warn on `rand`, `ring`, etc. being present in multiple versions —
# common transitively and harmless. This is just about vendor SDKs.
skip = []
skip-tree = []

[licenses]
# We accept OSI-approved licenses commonly used in the Rust ecosystem.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Boost Software License — used by xxhash-rust. Permissive,
    # Apache-2.0-compatible.
    "BSL-1.0",
    # Creative Commons / Linux Foundation CDLA-Permissive 2.0 — used
    # by webpki-roots 0.26/1.0 (Mozilla's root store bundle). Compatible
    # with everything we ship.
    "CDLA-Permissive-2.0",
    # aes-gcm / rsa style
    "OpenSSL",
]
confidence-threshold = 0.8
# If a new dependency carries an unrecognized license, CI fails and a
# human has to review. This is deliberate.

[advisories]
# Fail on any open security advisory that we can fix. The three
# entries below are documented exceptions for transitive deps whose
# upstream has not released a fix yet. Every new exception MUST have
# a comment explaining which crate pulls the affected version, which
# advisory is accepted, and the condition under which the exception
# is removed.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # protobuf v2.28: uncontrolled recursion panic (RUSTSEC-2024-0437).
    # Pulled in by `prometheus 0.13.4` (our metrics backend), which
    # pins protobuf 2.x via its own Cargo.toml. The fix requires
    # `prometheus 0.14+` using protobuf 3.7+ — not yet released at
    # time of audit (2026-05-10). This affects metric serialization,
    # not data path. Remove this ignore when `prometheus` ships a
    # release that moves to `protobuf 3.7+`.
    { id = "RUSTSEC-2024-0437", reason = "prometheus 0.13 transitively pins protobuf 2.x; metrics-path-only; tracked upstream" },
    # paste v1.0.15: unmaintained (RUSTSEC-2024-0436). Pulled in by
    # `datafusion-common 52` and `lance 4`. Proc-macro only, no
    # runtime attack surface. Remove when datafusion 53+ moves off
    # it.
    { id = "RUSTSEC-2024-0436", reason = "proc-macro only, pulled by datafusion/lance, tracked upstream" },
    # number_prefix v0.4.0: unmaintained (RUSTSEC-2025-0119). Pulled
    # in by `indicatif 0.17` via `hf-hub` and `tokenizers`. Used only
    # for pretty-printing progress bars during model download — no
    # runtime data-path exposure. Remove when `indicatif 0.18+` drops
    # the dep (already in flight upstream).
    { id = "RUSTSEC-2025-0119", reason = "CLI progress-bar formatting only; pulled by hf-hub/tokenizers; tracked upstream" },
    # pyo3 v0.24.2: GIL-detach closure soundness (RUSTSEC-2026-0176) and
    # `Sync` bound on closures (RUSTSEC-2026-0177), both fixed in pyo3
    # 0.29. Pulled ONLY by `galaxdb-python`, the optional PyO3 extension
    # module that is excluded from every shipped build (`--exclude
    # galaxdb-python`) due to a known pyo3 linker issue. The thin sync FFI
    # never detaches the GIL inside a closure, so there is no real-world
    # exposure in the core engine/server. The pyo3 0.24→0.29 migration is
    # a breaking change bundled with the galaxdb-python linker fix and is
    # tracked as its own task. Remove these when galaxdb-python moves to
    # pyo3 0.29+.
    { id = "RUSTSEC-2026-0176", reason = "pyo3 only via build-excluded galaxdb-python; no GIL-detach-in-closure usage; 0.29 migration tracked" },
    { id = "RUSTSEC-2026-0177", reason = "pyo3 only via build-excluded galaxdb-python; thin sync FFI, no Sync-closure usage; 0.29 migration tracked" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
