[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "galaxdb-client"
version = "0.1.1"
description = "GalaxDB Python client -- SQL, vector search, and local embeddings in one database"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/zentrix-innovative-labs/galaxdb"
Documentation = "https://github.com/zentrix-innovative-labs/galaxdb/blob/main/docs/GETTING_STARTED.md"
Repository = "https://github.com/zentrix-innovative-labs/galaxdb"
"Bug Tracker" = "https://github.com/zentrix-innovative-labs/galaxdb/issues"

[project.optional-dependencies]
# Dependencies for running the integration test suite under
# `galaxdb-python/tests/python/`. Install with:
#     pip install -e 'galaxdb-python[test]'
# Or explicitly:
#     pip install pytest pylance pyarrow
# `pylance` is the PyPI name for the `lance` import.
test = [
    "pytest>=7.0",
    "pylance>=0.16",
    "pyarrow>=14.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
